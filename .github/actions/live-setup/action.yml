# The environment of a live regression run on ubuntu-latest: the locked Python environment,
# Node.js, Playwright MCP and the headless Chromium it drives (the same pair as the Docker
# image). See docs/development/2026-11-10-regression-ci-cd-design.md §4.1.
name: live-setup
description: uv and the locked environment, Node.js, Playwright MCP and its Chromium

inputs:
  playwright-mcp-version:
    description: "@playwright/mcp version; keep it equal to PLAYWRIGHT_MCP_VERSION in the Dockerfile."
    default: "0.0.84"
  node-version:
    description: Node.js version of the MCP server (it needs >= 18).
    default: "20"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        # Matches the uv_build range in pyproject.toml; bump both together (gate.yml too).
        version: "0.12.21"
        enable-cache: true
    - name: Install the locked environment
      shell: bash
      run: uv sync --locked
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install Playwright MCP and its Chromium
      shell: bash
      env:
        PLAYWRIGHT_MCP_VERSION: ${{ inputs.playwright-mcp-version }}
      run: |
        npm install -g "@playwright/mcp@${PLAYWRIGHT_MCP_VERSION}"
        # The Playwright that @playwright/mcp depends on installs the browser it expects.
        cd "$(npm root -g)/@playwright/mcp"
        npx --yes playwright install --with-deps chromium
        command -v playwright-mcp
