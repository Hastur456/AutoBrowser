# Offline merge gate (docs/development/2026-11-10-regression-ci-cd-design.md §5.2): the
# offline test suite and all three scenario eval suites against the committed baselines, on
# Windows and Linux. No network, model, browser or secret; JUnit and a step summary per OS.
name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  # A newer push supersedes a pull request run; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Q6: the Linux job reports but does not fail the gate until it has been stable for two
    # weeks; then drop this line and make `gate (ubuntu-latest)` a required check.
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      # The reports are UTF-8; the Windows runner's console code page may not encode them.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    defaults:
      run:
        # bash on both runners (Git Bash on Windows): `-eo pipefail`, so `| tee` keeps the
        # exit code of the command it logs.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # Matches the uv_build range in pyproject.toml, so uv builds with its bundled
          # backend and keeps the lock format; bump both together.
          version: "0.12.21"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      - name: Tests (offline, without live and bench)
        run: |
          mkdir -p ci-out
          uv run pytest --junitxml=ci-out/junit.xml
      - name: Evals agent_loop_v2
        id: evals_agent_loop
        if: ${{ !cancelled() }}
        run: >
          uv run scripts/run_evals.py --baseline tests/evals/baselines/agent_loop_v2.json
          --memory-seed tests/evals/memory_seed | tee ci-out/evals-agent_loop_v2.txt
      - name: Evals playback_v1
        id: evals_playback
        if: ${{ !cancelled() }}
        run: >
          uv run scripts/run_evals.py --scenarios tests/evals/playback_scenarios
          --baseline tests/evals/baselines/playback_v1.json | tee ci-out/evals-playback_v1.txt
      - name: Evals cascade_v1
        id: evals_cascade
        if: ${{ !cancelled() }}
        run: >
          uv run scripts/run_evals.py --scenarios tests/evals/cascade_scenarios
          --baseline tests/evals/baselines/cascade_v1.json | tee ci-out/evals-cascade_v1.txt
      - name: Summary
        if: ${{ !cancelled() }}
        run: >
          uv run scripts/ci_summary.py gate --junit ci-out/junit.xml
          --eval "agent_loop_v2=${{ steps.evals_agent_loop.outcome }}=ci-out/evals-agent_loop_v2.txt"
          --eval "playback_v1=${{ steps.evals_playback.outcome }}=ci-out/evals-playback_v1.txt"
          --eval "cascade_v1=${{ steps.evals_cascade.outcome }}=ci-out/evals-cascade_v1.txt"
      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.os }}
          path: ci-out
          retention-days: 14
