# Minimal merge gate (docs/development/2026-10-19-autonomous-test-pipeline-design.md §1.3):
# the offline test suite and the scenario evals against the committed baseline, on Windows.
# scripts/ci.py will take these steps over later without changing what the gate checks.
name: gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      - name: Tests (offline, without live and bench)
        run: uv run pytest
      - name: Evals against the baseline
        run: uv run scripts/run_evals.py --baseline tests/evals/baselines/agent_loop_v1.json --memory-seed tests/evals/memory_seed
