# AutoBrowser settings file -- template.
#
# Copy this to config.yaml at the repo root and it is auto-loaded, no env var
# needed -- config.yaml (and config.local.yaml, for a name of your choosing) are
# both git-ignored, and config.yaml at that exact path is the one default file
# source the process ever loads on its own. This is a fixed path, not a
# working-directory scan: a config.yaml anywhere else is never picked up behind
# your back.
#
# To use a different file instead (or a second machine-specific profile), point
# the process at it explicitly:
#
#   AUTOBROWSER_CONFIG_FILE=config.local.yaml python main.py --task "inspect page"
#
# That name must be a real environment variable. A line in .env will not work:
# the path is resolved before settings are built, from the process environment
# only. AUTOBROWSER_CONFIG_FILE outranks the config.yaml default when both are
# present. If the variable names a file that does not exist, the process
# refuses to start rather than quietly using the defaults; the default file
# has no such requirement -- it is simply skipped when absent.
#
# Every value below is the default the code already has, so copying this file
# verbatim changes nothing. Commented-out keys are the ones whose default is
# "unset"; the comment shows the values they accept.
#
# Precedence, highest first:
#
#   Settings(...) kwargs > this file > AUTOBROWSER_* env > .env > secrets
#
# This file is a partial profile: it only has to name the fields you want it to
# decide, and those outrank everything below. Merging is per field, so naming
# llm.model here settles llm.model and leaves the rest of the llm block to the
# environment, .env and the defaults -- you never restate a whole section to
# change one value, and you never disable the fields you stay silent about.
#
# Because the file outranks the environment, a value here also beats an
# AUTOBROWSER_* variable and a .env line -- including this repository's own
# .env, which pins AUTOBROWSER_LLM__MODEL and AUTOBROWSER_BROWSER__CDP_PORT.
# That is what makes the file usable as a profile. Put something here only if
# you mean it to stick, and comment the line out to hand that field back to the
# environment.
#
# Section and field names mirror src/config.py exactly (llm, browser, loop,
# observation, memory, events, storage, flags, hooks). A name matching no section, or
# no field of a matching section, is rejected at startup instead of being
# ignored. .env.example lists every field with its default.
#
# Secrets: llm.api_key works here, and the file you name outranks .env, so this
# is a fine place to keep a key -- as long as the file stays out of git. The
# conventional names (config.yaml, config.local.yaml, secrets.yaml) are already
# in .gitignore, and a committed profile should be given a name of its own.

llm:
  # Chat model id, as the provider expects it.
  model: gemma4:31b-cloud                      # (default)
  # Sampling temperature. 0.0 keeps planning deterministic.
  temperature: 0.0                              # (default)
  # Base URL of the Ollama-compatible endpoint. null = unset: the provider then
  # falls back to its own default (OLLAMA_HOST or localhost). Set this to point
  # at a remote host.
  # host: http://localhost:11434                  # (unset by default) e.g. http://localhost:11434
  # Ollama cloud key. This file holds a live secret, so it must stay out of git.
  # A local daemon needs no key -- use null.
  # api_key: "YOUR_API_KEY"                        # (unset by default)
  # Reasoning budget. Accepted: minimal | low | medium | high. DECLARATIVE FOR
  # NOW -- see the note under max_reasoning_tokens.
  reasoning_effort: null                        # (default)
  # Cap on generated tokens per model call. Same status as reasoning_effort.
  max_output_tokens: null                       # (default) e.g. 4096, >= 1
  # Cap on tokens spent on internal reasoning, when the model bills them
  # separately from the answer. STATUS: src/providers/ollama.py forwards only
  # temperature (plus num_predict/num_ctx/top_p/seed), so these three reasoning
  # fields are recorded configuration until that adapter is taught the
  # parameters -- setting them here changes no request yet.
  max_reasoning_tokens: null                    # (default) e.g. 2048, >= 1

# ---------------------------------------------------------------------------
browser:
  # Chrome binary to launch. Forward slashes: python-dotenv decodes escapes in
  # double-quoted .env values, so "C:\temp" becomes a tab there.
  chrome_path: "C:/Program Files/Google/Chrome/Application/chrome.exe"
  # Persistent Chrome profile (logins, cookies, extensions) reused across runs.
  user_data_dir: "C:/temp/chrome_debug_profile"  # (default)
  # DevTools port Chrome is driven over.
  cdp_port: 9222                                # (default)
  # How long to wait for the CDP connection, in seconds.
  cdp_timeout_seconds: 30.0                     # (default)

# ---------------------------------------------------------------------------
# Loop guards. Each counter aborts or forces a replan rather than letting the
# engine spin; raising one trades tokens for persistence.
loop:
  # Hard bound on reasoning turns per task.
  turn_cap: 50                                  # (default)
  # How many times the engine may rebuild the plan for one task.
  max_replans: 3                                # (default)
  # Consecutive failed tool calls tolerated before the task is blocked.
  max_consecutive_failures: 3                   # (default)
  # Turns without plan progress before a replan is forced.
  max_steps_without_plan_advance: 8             # (default)
  # Identical results of the same tool call before a further identical call is
  # blocked and a replan is forced.
  max_ineffective_actions: 3                    # (default)
  # Wall-clock budget for one task, in seconds.
  task_timeout_seconds: 300.0                   # (default)
  # Silence in the event stream that means "stalled", in seconds. Clamped to
  # task_timeout_seconds, so a smaller task budget shortens it automatically.
  progress_timeout_seconds: 120.0               # (default)
  # Budget for loading the latest carried-forward session state, in seconds.
  # Clamped to task_timeout_seconds as well.
  latest_state_timeout_seconds: 15.0            # (default)

# ---------------------------------------------------------------------------
# How much tool output reaches the model. Lower = cheaper prompts, higher = less
# truncation. Truncation is always recorded in the observation.
observation:
  # Characters of page content kept per observation.
  max_content_preview_chars: 1200               # (default)
  # Snapshot element refs listed per observation.
  max_refs_in_observation: 25                   # (default)
  # Recent tool calls rendered in the Action History context block.
  action_history_limit: 12                      # (default)
  # Characters of arguments/result kept per Action History entry.
  action_history_preview_chars: 200             # (default)

# ---------------------------------------------------------------------------
# Agent memory: history shaping (the durable list lives on LoopState.messages)
# and persistent memory files under <storage.root_dir>/<memory.dir>/
# (guide: docs/development/memory.md). Everything past compaction is off by default.
memory:
  # Older tool outputs longer than this are compacted once a newer result of the
  # same tool exists; shorter outputs are always kept.
  compact_tool_output_min_chars: 1000           # (default)
  # With --compress-tools: characters kept of a tool message's summary or error,
  # of a snapshot summary and of a snapshot error.
  compressed_tool_result_chars: 500             # (default)
  compressed_snapshot_summary_chars: 300        # (default)
  compressed_snapshot_error_chars: 400          # (default)
  # Ceiling on the characters of the conversation history; past it the oldest
  # tool outputs become a [cleared] placeholder. 0 disables the budget.
  history_budget_chars: 0                       # (default)
  # The newest tool outputs the history budget never clears.
  keep_recent_tool_results: 3                   # (default)
  # Finished tasks kept verbatim in the session history; older ones are folded
  # into one digest message each. 0 keeps every task verbatim.
  keep_recent_tasks: 0                          # (default)
  # Characters of the user request / final answer kept in a task digest.
  digest_request_chars: 300                     # (default)
  digest_answer_chars: 500                      # (default)
  # Load persistent memory files into a "Memory" context block.
  persistent_enabled: false                     # (default)
  # Memory directory, relative to storage.root_dir.
  dir: memory                                   # (default)
  # Lines / characters of the memory index rendered into the prompt.
  index_max_lines: 200                          # (default)
  index_max_chars: 25000                        # (default)
  # Characters of the first body line used as the index description of a file
  # whose frontmatter has none.
  index_description_chars: 120                  # (default)
  # Characters of the whole Memory context block.
  block_max_chars: 12000                        # (default)
  # A body the block budget would cut below this many characters is left out of
  # the block instead of being shown as a stub.
  block_min_section_chars: 40                   # (default)
  # Characters of one memory file (truncated on read, refused on write).
  file_max_chars: 8000                          # (default)
  # Register the memory_view / memory_write tools (needs persistent_enabled).
  # Pair it with a review rule, e.g. under permissions.rules:
  #   - {id: memory-write-review, decision: ask, server: memory, tool: memory_write}
  tool_enabled: false                           # (default)
  # Successful tasks that load an unverified entry before it becomes verified.
  promote_after_successes: 2                    # (default)
  # Consecutive blocked tasks that load an entry before it becomes stale.
  stale_after_failures: 2                       # (default)
  # A verified entry older than this many days renders as stale. 0 = no TTL.
  stale_after_days: 90                          # (default)
  # After a done task, ask the model for up to consolidation_max_entries memory
  # entries (unverified). The model sees the current bodies for the visited sites
  # and merges into them; a merged entry keeps its trust counters.
  consolidate_on_goal_end: false                # (default)
  # Ceiling on the consolidation model call, in seconds.
  consolidation_timeout_seconds: 30.0           # (default)
  # Entries one consolidation call may write.
  consolidation_max_entries: 3                  # (default)
  # Characters of each consolidation prompt field (task, final answer, journal).
  consolidation_field_chars: 4000               # (default)
  # Characters of a reason, detail or path recorded in a memory.* event.
  event_reason_chars: 300                       # (default)
  # Characters of the model's working notes kept for the current task. 0 = off.
  working_notes_max_chars: 0                    # (default)

# ---------------------------------------------------------------------------
# Persisted event/trace detail under .autobrowser/sessions/<session_id>/.
events:
  # Longest string recorded in an event before it is truncated.
  max_string_chars: 20000                       # (default)
  # Text kept per entry in agent_trace.jsonl (a diagnostic sidecar, NOT the
  # metrics source of truth).
  agent_trace_max_text_chars: 500               # (default)

# ---------------------------------------------------------------------------
# Where runtime output lands.
storage:
  # Root for all session/batch output. Relative paths resolve from the CWD.
  root_dir: .autobrowser                        # (default)
  # <root_dir>/<sessions_subdir>/<session_id>/ -- session.json, tasks.json,
  # events.jsonl, workspace/.
  sessions_subdir: sessions                     # (default)
  # <root_dir>/<batches_subdir>/ -- batch run records.
  batches_subdir: batches                       # (default)
  # Per-session scratch space for screenshots and artifacts.
  workspace_subdir: workspace                   # (default)

# ---------------------------------------------------------------------------
flags:
  # INERT. The engine-native AgentLoopEngine is the only runtime; this parses
  # for CLI compatibility (--agent-loop) and changes no routing.
  agent_loop: false                             # (default)

# ---------------------------------------------------------------------------
# Deterministic tool authorization (src/harness/permissions.py), evaluated after
# pre_tool_use hooks on the final arguments. Matching rules resolve
# deny > ask > allow, whatever their order. A rule deny is not terminal: the
# model reads the reason and may take another path. No rule ships with the code
# and the engine knows no tool names: without rules nothing asks for approval.
permissions:
  # default:   a call without a matching rule runs.
  # read_only: only readOnlyHint tools and allow rules run; the rest is denied.
  # dont_ask:  every approval becomes a deny (headless runs, batch, evals).
  # bypass:    approvals are granted; deny rules and always_ask still hold.
  mode: default                                 # (default)
  # Who besides the rules may ask you to approve a state-changing call (a tool
  # without readOnlyHint). Their asks are always_ask (no session grant, no
  # bypass), turn into a deny under dont_ask and can never lift a rule.
  # off:        only rules and hooks ask.
  # model:      every such tool gets an optional approval_request argument; the
  #             acting model fills it ("pay 9 826 RUB for 2 items") and you are
  #             asked. No extra model call.
  # classifier: a separate model call judges every such call the rules let
  #             through; a failure or timeout asks (fail closed).
  # both:       either one asking is enough.
  approval_judge: "off"                         # (default) quoted: bare off is YAML false
  # classifier_model: gemma4:31b-cloud          # (unset by default) null = the session model
  classifier_timeout_seconds: 30.0              # (default)
  classifier_args_chars: 1500                   # (default) JSON arguments shown to the classifier
  classifier_description_chars: 400             # (default) tool description shown to it
  # approval_request values (lower-cased) that mean "no approval needed":
  approval_false_words: ["", "false", "no", "none", "null", "0"]  # (default)
  rules: []                                     # (default)
  # rules:
  #   # Opt-in guards for risky tools. MCP annotations cannot tell page
  #   # JavaScript from a click, so a rule has to name the tools.
  #   - id: page-js
  #     decision: ask
  #     always_ask: true                        # no session grant, no bypass
  #     tool: "browser_evaluate|browser_run_code(_unsafe)?"
  #     reason: "Running JavaScript in the page needs approval ({tool})."
  #   - id: file-handoff
  #     decision: ask
  #     tool: "browser_file_upload|browser_drop"
  #     reason: "Handing local files to the page needs approval ({tool})."
  #   - id: sensitive-tool-names
  #     decision: ask
  #     tool: "(?i).*(payment|purchase|delete_account|credential).*"
  #   - id: memory-write-review                 # human review of agent memory writes
  #     decision: ask
  #     server: memory
  #     tool: memory_write
  #   - id: confirm-forms
  #     decision: ask                           # allow | ask | deny
  #     tool: "browser_fill_form|browser_select_option"  # re.fullmatch on the name
  #     always_ask: false                       # true: no session grant, no bypass
  #     reason: "Filling forms needs approval ({tool})."
  #   - id: shop-only
  #     decision: deny
  #     server: playwright                      # exact; empty = any server
  #     tool: browser_navigate
  #     not_domains: [ozon.ru, wildberries.ru]  # suffix match; or domains: [...]
  #   - id: no-upload
  #     decision: deny
  #     tool: browser_file_upload
  #   # Click-target guardrail: matches the model's `element` text and the snapshot line
  #   # of the clicked ref (role + accessible name). A heuristic, not a boundary --
  #   # expect false positives; unresolvable targets ask (fail closed).
  #   - id: purchases
  #     decision: ask
  #     tool: browser_click
  #     target: '(?i)купить|оформить|оплатить|удалить|отправить|buy|pay|delete|submit'
  #   - id: no-card-numbers
  #     decision: deny
  #     tool: browser_type
  #     args: {text: '\d{4}[ -]?\d{4}[ -]?\d{4}[ -]?\d{4}'}  # {arg: re.search}

# ---------------------------------------------------------------------------
# Deterministic lifecycle hooks around the agent loop (src/harness/hooks.py).
# Handlers are "package.module:attr" import paths of async callables, resolved
# at session start -- an import error, a duplicate id or a sync handler fails
# startup. With `options`, the handler is a factory called once as
# handler(**options). Hooks run before the permission rules: a hook `allow`
# never lifts a rule, and `permission_request` is the only hook that can approve
# a call the permissions ask about.
hooks:
  # Master switch; off means no hook runs and nothing is emitted.
  enabled: false                                # (default)
  # Completions a stop hook may reject per task before done is accepted anyway.
  max_stop_blocks: 2                            # (default)
  # Timeout of a hook without its own timeout_seconds. Must stay below
  # loop.progress_timeout_seconds.
  default_timeout_seconds: 10.0                 # (default)
  # Hooks, run sequentially in this order per event. Example:
  registry: []                                  # (default)
  # registry:
  #   - id: urls
  #     event: pre_tool_use                     # goal_start | pre_tool_use |
  #                                             # permission_request | post_tool_use |
  #                                             # post_tool_use_failure | stop | goal_end
  #     handler: src.browser.hooks:url_policy
  #     match: {tool: browser_navigate}         # tool events only; tool is a fullmatch regex
  #     options: {deny_domains: [example.com]}
  #   - id: grounded
  #     event: stop
  #     handler: src.harness.builtin_hooks:grounded_final_answer
  #     options: {min_chars: 1}
  #     timeout_seconds: 5.0                    # (default: default_timeout_seconds)
  #     fail_closed: null                       # (default: per-event behavior)
  #   - id: audit                               # external command, Claude Code/Codex style
  #     event: pre_tool_use
  #     type: command                           # (default: python)
  #     # Runs in the repo root; the event arrives as JSON on stdin. Exit 2 blocks with
  #     # stderr as the reason; exit 0 with a JSON object on stdout returns decision /
  #     # reason / updated_input / updated_output / additional_context.
  #     command: python scripts/hooks/audit.py
  #     match: {server: playwright}
  #
  # Basic command hooks (scripts/hooks/*.py) -- a ready starter set in the Claude
  # Code/Codex style: one self-contained, stdlib-only script per hook, the event as JSON on
  # stdin, exit 2 to block, JSON on stdout for ask / rewrites. To switch them on, copy this
  # file to config.yaml, set `enabled: true` above and replace `registry: []` with the
  # block below (uncommented). Keep only the entries you want; the order is the run order
  # per event. Options are command-line flags. Guide:
  # docs/development/lifecycle-hooks.md#basic-command-hooks
  #
  # registry:
  #   # Clicking "Оплатить" / "Оформить заказ" / "Удалить" / "Place order" needs approval.
  #   # The CLI asks in a terminal (headless: denied, the model continues); add
  #   # --decision deny to block only that call. --keyword TEXT replaces the defaults.
  #   - id: sensitive-actions
  #     event: pre_tool_use
  #     type: command
  #     command: python scripts/hooks/sensitive_action_guard.py
  #     match: {tool: browser_click|browser_type|browser_select_option}
  #   # Never type a Luhn-valid card number into a page (--pattern REGEX adds secrets).
  #   - id: secret-input
  #     event: pre_tool_use
  #     type: command
  #     command: python scripts/hooks/secret_input_guard.py
  #     match: {tool: browser_type|browser_fill_form}
  #   # Mask e-mails, phone numbers and card numbers in tool output (--kinds email,phone,card).
  #   - id: pii
  #     event: post_tool_use
  #     type: command
  #     command: python scripts/hooks/pii_redaction.py
  #     match: {tool: browser_.*}
  #   # Tell the model a captcha / access block is in the way (--pattern REGEX extends).
  #   - id: obstacles
  #     event: post_tool_use
  #     type: command
  #     command: python scripts/hooks/page_obstacle_detector.py
  #     match: {tool: browser_snapshot|browser_navigate}
  #   # Reject a final answer whose links are not in the latest observation.
  #   - id: grounded-urls
  #     event: stop
  #     type: command
  #     command: python scripts/hooks/grounded_urls.py
