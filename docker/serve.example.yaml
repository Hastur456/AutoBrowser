# A stand profile for the Docker image: copy to data/serve.yaml (mounted as /data) and edit.
# Every field is documented in config.example.yaml; only what the container needs is here.
# The token comes from AUTOBROWSER_SERVE__TOKEN (compose.yaml), never from this file.

llm:
  provider: ollama
  model: gemma4:31b-cloud
  # host: https://ollama.com

# The MCP server launches its own headless Chromium; the session starts no browser.
browser:
  launch: external

mcp_servers:
  playwright:
    transport: stdio
    command: playwright-mcp
    args:
      - --headless
      - --browser
      - chromium
      - --user-data-dir
      - "{profile_dir}"            # the worker's own profile: /data/serve/profiles/w<i>
      # - --no-sandbox            # only if Chromium refuses to start without it
      # - --allowed-origins       # a browser-level allowlist on top of serve.jobs.*.domains
      # - https://shop.example
    stateful: true

replay:
  enabled: true                    # probes and recordings need it

permissions:
  mode: default                    # the stand turns it into dont_ask without api_approvals

loop:
  max_task_model_calls: 30

serve:
  host: 0.0.0.0                    # inside the container; compose publishes 127.0.0.1 only
  allow_remote: true
  # workers: 2                     # parallel jobs, each its own Chromium (memory.persistent_enabled off)
  timezone: Europe/Berlin
  daily_max_runs: 200
  default_run_budget: {max_model_calls: 20}
  jobs:
    price-watch:
      task: "Open https://shop.example/item/1 and report the current price."
      triggers:
        - {id: hourly, type: cron, schedule: "0 * * * *"}
      probe:
        steps:
          - {tool: browser_navigate, args: {url: "https://shop.example/item/1"}}
          - {tool: browser_snapshot}
        select: "(?s)Price.*?USD"
      recording: price-watch
      record_on_success: true
      max_stage: agent
      domains: [shop.example]
      notify_on: [change, failure, blocked, budget]
