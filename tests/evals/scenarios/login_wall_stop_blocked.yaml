name: login_wall_stop_blocked
task: Download the March invoice from https://billing.example/invoices.
strict: true
model:
  responses:
  - steps:
    - {id: 1, description: Open the invoices page, status: pending}
    - {id: 2, description: Download the March invoice, status: pending}
  - decision: tool_call
    tool_request: {name: browser_navigate, args: {url: 'https://billing.example/invoices'}, reason: Open the invoices page.}
  - decision: tool_call
    tool_request: {name: browser_snapshot, args: {}, reason: Inspect the page.}
  - decision: stop
    status: blocked
    message: The invoices page requires a login and no credentials were provided.
browser:
  snapshots:
  - '- Page URL: about:blank'
  - |-
    - Page URL: https://billing.example/login
    - heading "Sign in" [ref=e1]
    - textbox "Email" [ref=e2]
    - textbox "Password" [ref=e3]
    - button "Sign in" [ref=e4]
assertions:
  expected_terminal_status: blocked
  final_answer_contains:
  - requires a login
  max_tool_calls: 2
  max_repeated_actions: 0
  max_policy_blocks: 0
