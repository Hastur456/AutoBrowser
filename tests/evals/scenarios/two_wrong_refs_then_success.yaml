name: two_wrong_refs_then_success
task: Click 'Download PDF' on https://reports.example/q3.
strict: true
model:
  responses:
  - steps:
    - {id: 1, description: Open the report, status: pending}
    - {id: 2, description: Download the PDF, status: pending}
  - decision: tool_call
    tool_request: {name: browser_navigate, args: {url: 'https://reports.example/q3'}, reason: Open the report.}
  - decision: tool_call
    tool_request: {name: browser_click, args: {ref: e10}, reason: Click Download PDF.}
  - decision: tool_call
    tool_request: {name: browser_click, args: {ref: e11}, reason: Try the other download ref.}
  - decision: tool_call
    tool_request: {name: browser_snapshot, args: {}, reason: Both refs failed; re-read the page.}
  - decision: tool_call
    tool_request: {name: browser_click, args: {ref: e4}, reason: Click Download PDF.}
  - decision: done
    final_answer: Clicked 'Download PDF'; the page shows 'Download started'.
browser:
  snapshots:
  - '- Page URL: about:blank'
  - |-
    - Page URL: https://reports.example/q3
    - heading "Q3 report" [ref=e2]
    - link "Download PDF" [ref=e4]
  - |-
    - Page URL: https://reports.example/q3
    - status "Download started" [ref=e6]
assertions:
  expected_terminal_status: completed
  final_answer_contains:
  - Download started
  max_tool_calls: 5
  max_repeated_actions: 0
  max_policy_blocks: 0
